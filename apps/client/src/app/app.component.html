<router-outlet></router-outlet>

<div class="min-h-screen bg-slate-50 p-8">
  <div class="max-w-6xl mx-auto">
    
    <header class="flex justify-between items-center border-b border-slate-200 pb-6 mb-8">
      <div>
        <h1 class="text-3xl font-black text-slate-900 tracking-tight">Store Management</h1>
        <p class="text-slate-500 text-sm">Tailwind v4 Engine + Patched PrimeNG 19 Layout</p>
      </div>
      <p-button label="Add Product" icon="pi pi-plus" severity="success"></p-button>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs hover:shadow-md transition-all">
        <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">Active Inventory</span>
        <div class="text-3xl font-black text-slate-800 mt-2">1,248</div>
      </div>
      
      <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs hover:shadow-md transition-all">
        <span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">Monthly Revenue</span>
        <div class="text-3xl font-black text-slate-800 mt-2">$42,350</div>
      </div>

      <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs hover:shadow-md transition-all">
        <span class="text-xs font-bold text-amber-600 uppercase tracking-wider">System Health</span>
        <div class="text-emerald-500 font-semibold text-sm mt-3 flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
          All Systems Operational
        </div>
      </div>
    </div>

    <section class="mt-10">
      <h2 class="text-2xl font-bold text-slate-900 mb-4">Categories loaded from backend</h2>

      <div *ngIf="loadingCategories" class="text-slate-500 mb-4">Loading categories...</div>
      <div *ngIf="categoryError" class="text-red-600 mb-4">{{ categoryError }}</div>

      <div class="grid gap-4">
        <div *ngFor="let category of categories" class="bg-white p-5 rounded-2xl border border-slate-100 shadow-xs">
          <div class="font-semibold text-slate-900 text-lg">{{ category.name }}</div>
          <p class="text-sm text-slate-500 mt-2">{{ category.description }}</p>
          <p class="text-xs text-slate-400 mt-3">ID: {{ category.id }}</p>
        </div>
      </div>
    </section>

  </div>
</div>
